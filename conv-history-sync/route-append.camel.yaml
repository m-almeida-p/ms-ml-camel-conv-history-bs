- route:
    id: routeAppend
    description: 4 Append
    note: "A message for a conversation Foundry already has. Called by step 2.5.2. Docs: conv-history-sync.md > Routes."
    nodePrefixId: routeAppend
    routeConfigurationId: errorRules
    from:
      id: fromDirectAppend
      description: Called by step 2.5.2
      uri: direct
      parameters:
        name: append
      steps:
        - to:
            id: findLastItem
            description: 4.1 Find the last mapped item
            uri: sql
            parameters:
              dataSource: "#pgDataSource"
              outputType: SelectOne
              outputHeader: lastItemRow
              query: >-
                SELECT foundry_item_id FROM foundry_item_map
                WHERE conversation_id = :#conversationId ORDER BY sequence DESC LIMIT 1
        - to:
            id: findCandidates
            description: 4.2 Find the messages that come next
            note: "The stored messages after the last mapped one, in order: what Foundry should hold after that item. Docs: conv-history-sync.md > Reconciliation."
            uri: sql
            parameters:
              dataSource: "#pgDataSource"
              outputType: SelectList
              outputHeader: candidates
              query: >-
                SELECT sequence, role, text FROM conversation_messages
                WHERE conversation_id = :#conversationId
                  AND sequence > COALESCE((SELECT max(sequence) FROM foundry_item_map WHERE conversation_id = :#conversationId), 0)
                ORDER BY sequence LIMIT 100
        - bean:
            id: addOrAdoptItem
            description: 4.3 Add or adopt the item
            note: "One step: look for an item an earlier, lost call kept, adopt it, or send. Camel retries only the step that failed, so the look and the send must be one. Docs: conv-history-sync.md > Reconciliation."
            ref: foundry
            method: addItem
        - choice:
            id: whetherToRebuild
            description: 4.4 Rebuild or go on
            when:
              - id: whenMismatch
                description: Foundry holds something unknown
                expression:
                  simple:
                    expression: "${header.reconcileMismatch} == true || ${header.foundryGone} == true"
                steps:
                  - throwException:
                      id: rebuildNotHandledYet
                      description: 4.4.1 Not handled yet
                      exceptionType: java.lang.IllegalStateException
                      message: "Conversation ${header.conversationId} must be rebuilt in Foundry"
        - to:
            id: saveItems
            description: 4.5 Record the items
            note: "One statement: the item rows, adopted and new, and the conversation's last synced sequence. Docs: conv-history-sync.md > Reconciliation."
            uri: sql
            parameters:
              dataSource: "#pgDataSource"
              query: >-
                WITH recorded AS (
                  INSERT INTO foundry_item_map (conversation_id, sequence, foundry_item_id)
                  SELECT CAST(:#conversationId AS varchar), a.sequence, a."itemId"
                  FROM json_to_recordset(CAST(:#adoptJson AS json)) AS a(sequence int, "itemId" text)
                  RETURNING sequence
                )
                UPDATE foundry_conversation_map
                SET last_synced_sequence = GREATEST(last_synced_sequence, (SELECT max(sequence) FROM recorded))
                WHERE conversation_id = CAST(:#conversationId AS varchar)
        - choice:
            id: whetherAdopted
            description: 4.6 Note an adoption
            when:
              - id: whenAdoptedCurrent
                description: Foundry already held it
                expression:
                  simple:
                    expression: "${header.adoptedCurrent} == true"
                steps:
                  - log:
                      id: logAdopted
                      description: 4.6.1 Log the adoption
                      message: "Message adopted conversation=${header.conversationId} sequence=${header.sequence} (Foundry already held it)"
