- route:
    id: routeReceive
    description: 1 Receive
    note: "One record, from Kafka to a committed offset. Docs: conv-history-sync.md > Routes."
    nodePrefixId: routeReceive
    routeConfigurationId: errorRules
    from:
      id: fromEventsTopic
      description: Topic (Event-Driven Consumer)
      note: "Reads {{app.topic}} as group {{app.kafka.groupId}}, a group of its own. Auto commit is off. Docs: conv-history-sync.md > Settings."
      uri: kafka
      parameters:
        topic: "{{app.topic}}"
        brokers: "{{app.kafka.brokers}}"
        groupId: "{{app.kafka.groupId}}"
        autoOffsetReset: earliest
        autoCommitEnable: false
        allowManualCommit: true
        breakOnFirstError: true
        # A record costs about two Foundry calls (a rebuild, one per message), and waits up to ten minutes for the consumer, so a poll of
        # 500 records could outlast Kafka's 300 s and get the consumer evicted from the group. Smaller polls, and a longer allowance.
        maxPollRecords: "20"
        maxPollIntervalMs: "1800000"
        valueDeserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      steps:
        - bean:
            id: decodeRecord
            description: 1.1 Decode (Message Translator)
            note: "Same decoder as the consumer: schema id, registry schema, contract, projection. A bad record goes to route 3. Docs: conv-history-sync.md > Routes."
            ref: decoder
            method: decode
        - choice:
            id: routeByRecordKind
            description: 1.2 Route (Content-Based Router)
            note: "A tombstone and an event that is not a chat message are skipped; a chat message goes to route 2. Docs: conv-history-sync.md > Routes."
            when:
              - id: whenTombstone
                description: Tombstone
                expression:
                  simple:
                    expression: "${header.Tombstone} == true"
                steps:
                  - log:
                      id: logTombstoneSkipped
                      description: 1.2.1 Skip tombstone
                      message: "Tombstone skipped topic=${header.CamelKafkaTopic} partition=${header.CamelKafkaPartition} offset=${header.CamelKafkaOffset}"
              - id: whenChatMessage
                description: Chat message
                expression:
                  simple:
                    expression: "${body[projectable]} == true"
                steps:
                  - to:
                      id: callSyncRoute
                      description: 1.2.2 Sync (route 2)
                      uri: direct
                      parameters:
                        name: sync
            otherwise:
              id: otherwiseSkip
              description: Not a chat message
              steps:
                - log:
                    id: logNotChatMessage
                    description: 1.2.3 Skip other events
                    message: "Not a chat message, skipped event=${body[eventName]} conversation=${header.conversationId} sequence=${header.sequence}"
        - bean:
            id: commitOffset
            description: 1.3 Commit (at-least-once)
            note: "The offset moves only now. After a crash the record comes back and route 2 ignores the repeat. Docs: conv-history-sync.md > Routes."
            ref: offsetCommit
            method: commit
