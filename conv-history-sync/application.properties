camel.main.name=conv-history-sync
camel.main.description=conv-history-sync
camel.jbang.gav=org.apache.camel.karavan.demo:conv-history-sync:1
camel.jbang.dependencies=camel-console,camel-sql,camel-jackson,org.postgresql:postgresql:42.7.12,com.zaxxer:HikariCP:6.2.1,com.networknt:json-schema-validator:1.5.6
camel.jbang.excludes=*.md
camel.jbang.health=true
camel.jbang.runtime=camel-main
camel.context.dev-console=true
camel.health.enabled=true
camel.health.exposureLevel=full
camel.main.autoConfigurationFailFast=false
camel.main.shutdownTimeout=8
camel.main.extraShutdownTimeout=1
camel.main.logLanguage=simple
camel.main.tracingStandby=true
camel.metrics.binders=file-descriptor,jvm-gc,jvm-heap-pressure,jvm-info,jvm-memory,jvm-thread,processor,uptime
camel.metrics.enabled=true
camel.metrics.enableMessageHistory=true
camel.routecontroller.backOffDelay=5000
camel.routecontroller.backOffMaxAttempts=100
camel.routecontroller.initialDelay=1000
camel.routecontroller.enabled=false
camel.routecontroller.threadPoolSize=2
camel.management.devConsoleEnabled=true
camel.management.downloadEnabled=true
camel.management.healthCheckEnabled=true
camel.management.jolokiaEnabled=false
camel.management.metricsEnabled=true
camel.management.sendEnabled=true
camel.management.enabled=true
camel.server.enabled=true
camel.trace.enabled=false
camel.trace.standby=true
camel.management.port=9876
camel.management.path=/q
jib.skip=false
app.topic=yape.event_store.conversation_events
app.kafka.brokers=kafka:29092
app.kafka.groupId=ms-ml-camel-conv-history-sync
app.schema.registryUrl=http://schema-registry:8081
app.schema.allowedIds=2
app.schema.requireFraming=true
app.db.url=jdbc:postgresql://db:5432/postgres?currentSchema=camel_history
app.db.user=postgres
app.foundry.tokenUrl=http://foundry-token:8099/token
app.foundry.endpoint=
app.foundry.timeoutMs=10000
# Which stack made a Foundry conversation (its metadata.instance). Give each developer or environment that shares a Foundry project its own.
app.foundry.instance=default
app.sync.projectionWaitSeconds=600
camel.beans.pgDataSource=#class:com.zaxxer.hikari.HikariDataSource
camel.beans.pgDataSource.driverClassName=org.postgresql.Driver
camel.beans.pgDataSource.jdbcUrl={{app.db.url}}
camel.beans.pgDataSource.username={{app.db.user}}
camel.beans.pgDataSource.maximumPoolSize=2
camel.beans.pgDataSource.connectionTimeout=5000
