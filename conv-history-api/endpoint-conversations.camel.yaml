- rest:
    id: restConversations
    description: GET /v1/conversations
    get:
      - id: getConversations
        description: List the conversations of an account
        path: /v1/conversations
        to: direct:conversations
- route:
    id: routeConversations
    description: Conversations
    note: "The conversations of an account that are in Foundry, most recent first. Docs: conv-history-api.md > Endpoints."
    nodePrefixId: routeConversations
    routeConfigurationId: apiErrors
    from:
      id: fromConversations
      description: Called by GET /v1/conversations
      uri: direct
      parameters:
        name: conversations
      steps:
        - bean:
            id: readConversationsRequest
            description: 1.1 Read and check the request
            note: "Account, cursor and page size, as the contract says. A bad one is a 400. Docs: conv-history-api.md > Endpoints."
            ref: apiRequest
            method: conversations
        - choice:
            id: pickDirection
            description: 1.2 Page (Content-Based Router)
            note: "Three reads of conversation_summaries, joined to the conversations Foundry holds: the newest page, the page before a cursor, the page after it. One more row than the page tells whether more exist. Docs: conv-history-api.md > The conversation list."
            when:
              - id: whenBefore
                description: Before a cursor
                expression:
                  simple:
                    expression: "${exchangeProperty.direction} == 'before'"
                steps:
                  - to:
                      id: findPageBefore
                      description: 1.2.1 Older than the cursor
                      uri: sql
                      parameters:
                        dataSource: "#pgDataSource"
                        query: >-
                          SELECT s.conversation_id, s.message_count, s.first_occurred_at, s.last_occurred_at
                          FROM conversation_summaries s JOIN foundry_conversation_map f ON f.conversation_id = s.conversation_id
                          WHERE s.id_yape_account = :#${exchangeProperty.account}
                            AND (s.last_occurred_at, s.conversation_id) <
                                (timestamptz 'epoch' + CAST(:#${exchangeProperty.cursorMicros} AS bigint) * interval '1 microsecond',
                                 CAST(:#${exchangeProperty.cursorId} AS varchar))
                          ORDER BY s.last_occurred_at DESC, s.conversation_id DESC
                          LIMIT CAST(:#${exchangeProperty.limit} AS int)
              - id: whenAfter
                description: After a cursor
                expression:
                  simple:
                    expression: "${exchangeProperty.direction} == 'after'"
                steps:
                  - to:
                      id: findPageAfter
                      description: 1.2.2 More recent than cursor
                      uri: sql
                      parameters:
                        dataSource: "#pgDataSource"
                        query: >-
                          SELECT s.conversation_id, s.message_count, s.first_occurred_at, s.last_occurred_at
                          FROM conversation_summaries s JOIN foundry_conversation_map f ON f.conversation_id = s.conversation_id
                          WHERE s.id_yape_account = :#${exchangeProperty.account}
                            AND (s.last_occurred_at, s.conversation_id) >
                                (timestamptz 'epoch' + CAST(:#${exchangeProperty.cursorMicros} AS bigint) * interval '1 microsecond',
                                 CAST(:#${exchangeProperty.cursorId} AS varchar))
                          ORDER BY s.last_occurred_at ASC, s.conversation_id ASC
                          LIMIT CAST(:#${exchangeProperty.limit} AS int)
            otherwise:
              id: otherwiseNewest
              description: No cursor
              steps:
                - to:
                    id: findPageNewest
                    description: 1.2.3 The most recent
                    uri: sql
                    parameters:
                      dataSource: "#pgDataSource"
                      query: >-
                        SELECT s.conversation_id, s.message_count, s.first_occurred_at, s.last_occurred_at
                        FROM conversation_summaries s JOIN foundry_conversation_map f ON f.conversation_id = s.conversation_id
                        WHERE s.id_yape_account = :#${exchangeProperty.account}
                        ORDER BY s.last_occurred_at DESC, s.conversation_id DESC
                        LIMIT CAST(:#${exchangeProperty.limit} AS int)
        - bean:
            id: buildConversationList
            description: 1.3 Build the answer
            note: "The page as the contract writes it, with the cursors and the Link header when more exist. Docs: conv-history-api.md > The conversation list."
            ref: conversationList
            method: build
